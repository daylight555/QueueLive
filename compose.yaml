services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: queuelive
      POSTGRES_USER: queuelive
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuelive"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/queuelive
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
volumes:
  pgdata:
